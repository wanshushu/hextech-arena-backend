<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a3f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ff88;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- 背景圆角矩形 -->
  <rect x="10" y="10" width="180" height="180" rx="36" ry="36" fill="url(#bg)" stroke="#00f0ff" stroke-width="2" stroke-opacity="0.3"/>
  <!-- 六边形（海克斯主题） -->
  <polygon points="100,35 140,57.5 140,102.5 100,125 60,102.5 60,57.5" fill="none" stroke="url(#glow)" stroke-width="3" opacity="0.6"/>
  <polygon points="100,50 128,66 128,98 100,114 72,98 72,66" fill="none" stroke="url(#glow)" stroke-width="2" opacity="0.4"/>
  <!-- 核心图标：盾牌 + 闪电 -->
  <path d="M100,60 L120,78 L120,105 Q100,120 80,105 L80,78 Z" fill="url(#glow)" opacity="0.15"/>
  <path d="M100,60 L120,78 L120,105 Q100,120 80,105 L80,78 Z" fill="none" stroke="url(#glow)" stroke-width="2.5"/>
  <!-- 闪电符号 -->
  <path d="M105,75 L95,92 L105,92 L95,108" fill="none" stroke="#00f0ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 文字 -->
  <text x="100" y="158" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="700" fill="#00f0ff">海斗</text>
  <text x="100" y="178" text-anchor="middle" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="400" fill="#888888">助手</text>
</svg>
