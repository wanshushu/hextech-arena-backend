<h2>UI 重新设计方案</h2>
<p class="subtitle">选择你喜欢的视觉方向，然后我们再细化</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>电竞风格</h3>
      <p>深色背景 + 霓虹高亮色，参考游戏内 HUD 风格。梯队用强烈对比色（T1 红色、T5 蓝色），英雄名字大字号。</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>简洁卡片风格</h3>
      <p>白色/浅灰背景，卡片圆角，信息层级分明。类似 iOS 原生设计，胜率/选取率用小标签。</p>
    </div>
  </div>
  <div class="option" data-choice="c" onclick="toggleSelect(this)">
    <div class="letter">C</div>
    <div class="content">
      <h3>暗色精致风</h3>
      <p>深灰背景 + 金色/紫色强调，类似云顶之弈/英雄联盟色调。图标更大更突出，信息密度高。</p>
    </div>
  </div>
</div>
